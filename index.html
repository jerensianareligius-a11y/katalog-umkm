    <script>
        const products = [
            { id: 1, name: "Amplang Kuku Macan Asli", category: "Makanan Ringan", price: 25000, icon: "🐟", desc: "Kerupuk ikan tenggiri khas Balikpapan yang renyah dan gurih (200gr)." },
            { id: 2, name: "Keripik Singkong Balado", category: "Makanan Ringan", price: 15000, icon: "🥔", desc: "Singkong pilihan dengan bumbu balado pedas manis tanpa pengawet." },
            { id: 3, name: "Kopi Liberika Borneo", category: "Minuman", price: 45000, icon: "☕", desc: "Biji kopi sangrai khas Kalimantan dengan aroma nangka yang unik (250gr)." },
            { id: 4, name: "Sirup Mangrove Segar", category: "Minuman", price: 30000, icon: "🍹", desc: "Minuman kesehatan olahan buah mangrove pedada kaya antioksidan." },
            { id: 5, name: "Sambal Raja Kutai", category: "Sambal & Bumbu", price: 28000, icon: "🌶️", desc: "Sambal khas kerajaan Kutai dengan campuran terong dan kacang panjang." },
            { id: 6, name: "Abon Kepiting Balikpapan", category: "Sambal & Bumbu", price: 55000, icon: "🦀", desc: "Abon daging kepiting murni 100% tanpa campuran, cocok untuk lauk." }
        ];

        const SELLER_WHATSAPP = "6281234567890";
        let cart = [];
        let currentCategory = "Semua";

        function formatRupiah(angka) { return "Rp " + angka.toLocaleString("id-ID"); }

        function renderProducts(data) {
            const list = document.getElementById("product-list");
            list.innerHTML = "";
            if (data.length === 0) { list.innerHTML = "<p>Produk tidak ditemukan.</p>"; return; }
            data.forEach(item => {
                list.innerHTML += `<div class="card"><div class="card-img">${item.icon}</div><div class="card-body"><span class="card-cat">${item.category}</span><h3 class="card-title">${item.name}</h3><p class="card-desc">${item.desc}</p><div class="card-footer"><span class="price">${formatRupiah(item.price)}</span><button class="add-btn" onclick="addToCart(${item.id})">+ Keranjang</button></div></div></div>`;
            });
        }

        function filterCategory(category, btn) {
            currentCategory = category;
            document.querySelectorAll(".cat-btn").forEach(b => b.classList.remove("active"));
            btn.classList.add("active");
            applyFilter();
        }

        function searchProduct() { applyFilter(); }

        function applyFilter() {
            const keyword = document.getElementById("search-input").value.toLowerCase();
            const filtered = products.filter(p => (currentCategory === "Semua" || p.category === currentCategory) && (p.name.toLowerCase().includes(keyword) || p.desc.toLowerCase().includes(keyword)));
            renderProducts(filtered);
        }

        function addToCart(id) {
            const product = products.find(p => p.id === id);
            const existing = cart.find(item => item.id === id);
            if (existing) { existing.qty += 1; } else { cart.push({ ...product, qty: 1 }); }
            updateCartUI();
        }

        function changeQty(id, delta) {
            const index = cart.findIndex(item => item.id === id);
            if (index !== -1) {
                cart[index].qty += delta;
                if (cart[index].qty <= 0) { cart.splice(index, 1); }
            }
            updateCartUI();
        }

        function updateCartUI() {
            const cartItemsEl = document.getElementById("cart-items");
            const cartCountEl = document.getElementById("cart-count");
            const cartTotalEl = document.getElementById("cart-total");
            const totalQty = cart.reduce((sum, item) => sum + item.qty, 0);
            const totalPrice = cart.reduce((sum, item) => sum + (item.price * item.qty), 0);
            cartCountEl.textContent = totalQty;
            cartTotalEl.textContent = formatRupiah(totalPrice);
            if (cart.length === 0) { cartItemsEl.innerHTML = `<p style="color: var(--gray); text-align: center; margin-top: 2rem;">Keranjang masih kosong.</p>`; return; }
            cartItemsEl.innerHTML = "";
            cart.forEach(item => {
                cartItemsEl.innerHTML += `<div class="cart-item"><div class="item-info"><h4>${item.name}</h4><p>${formatRupiah(item.price)} x ${item.qty}</p></div><div class="qty-controls"><button class="qty-btn" onclick="changeQty(${item.id}, -1)">-</button><span>${item.qty}</span><button class="qty-btn" onclick="changeQty(${item.id}, 1)">+</button></div></div>`;
            });
        }

        function toggleCart() { document.getElementById("cart-modal").classList.toggle("open"); }

        function checkoutWhatsApp() {
            if (cart.length === 0) { alert("Keranjang belanja Anda masih kosong!"); return; }
            const name = document.getElementById("buyer-name").value.trim();
            const address = document.getElementById("buyer-address").value.trim();
            if (!name || !address) { alert("Harap isi Nama Pemesan dan Alamat Pengiriman terlebih dahulu."); return; }
            let message = `Halo *BorneoRasa UMKM*, saya ingin memesan:\n\n`;
            let total = 0;
            cart.forEach((item, index) => {
                const subtotal = item.price * item.qty;
                total += subtotal;
                message += `${index + 1}. ${item.name} (${item.qty}x) = ${formatRupiah(subtotal)}\n`;
            });
            message += `\n*Total Pembayaran: ${formatRupiah(total)}*\n\n*Data Pemesan:*\nNama: ${name}\nAlamat: ${address}`;
            window.open(`https://wa.me{SELLER_WHATSAPP}?text=${encodeURIComponent(message)}`, "_blank");
        }

        renderProducts(products);
    </script>
</body>
</html>
