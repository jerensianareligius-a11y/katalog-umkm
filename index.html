<!DOCTYPE html>
<html lang="id">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>BorneoRasa UMKM Balikpapan</title>
<style>
body{font-family:Arial,sans-serif;margin:0;background:#f9fafb;color:#1f2937}
header{background:#fff;padding:14px 24px;display:flex;justify-content:space-between;align-items:center;box-shadow:0 2px 6px rgba(0,0,0,.08);position:sticky;top:0;z-index:50}
.logo{font-size:22px;font-weight:bold;color:#d97706}
.btn{background:#d97706;color:#fff;border:none;padding:9px 15px;border-radius:8px;cursor:pointer;font-weight:bold}
.hero{background:#fef3c7;padding:35px 20px;text-align:center}
.wrap{max-width:1050px;margin:20px auto;padding:0 15px}
.bar{display:flex;flex-wrap:wrap;justify-content:space-between;gap:10px;margin-bottom:20px}
.cat{padding:7px 14px;border:1px solid #ddd;background:#fff;border-radius:20px;cursor:pointer}
.cat.on{background:#d97706;color:#fff;border-color:#d97706}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(230px,1fr));gap:16px}
.card{background:#fff;border-radius:10px;padding:15px;box-shadow:0 2px 6px rgba(0,0,0,.06);display:flex;flex-direction:column}
.ico{font-size:46px;text-align:center;background:#fef3c7;padding:18px;border-radius:8px;margin-bottom:8px;cursor:pointer}
.modal{position:fixed;inset:0;background:rgba(0,0,0,.5);display:none;justify-content:flex-end;z-index:100}
.modal.mid{justify-content:center;align-items:center;padding:15px}
.modal.open{display:flex}
.panel{background:#fff;width:380px;max-width:100%;height:100%;padding:20px;overflow-y:auto;display:flex;flex-direction:column}
.pop{background:#fff;width:420px;max-width:100%;border-radius:12px;padding:20px}
input,textarea,select{width:100%;padding:8px;margin:4px 0 10px;border:1px solid #ddd;border-radius:6px;box-sizing:border-box}
.rev{background:#fff;padding:20px;border-radius:12px;margin-top:40px}
.rev-item{background:#f9fafb;padding:10px 14px;border-left:4px solid #d97706;margin-top:10px;border-radius:6px}
footer{background:#1f2937;color:#fff;text-align:center;padding:18px;margin-top:40px;font-size:13px}
</style>
</head>
<body>
<header>
  <div class="logo">BorneoRasa UMKM</div>
  <button class="btn" onclick="buka('cart-m')">🛒 Keranjang (<span id="cnt">0</span>)</button>
</header>
<div class="hero">
  <h1>Produk Unggulan UMKM Balikpapan</h1>
  <p>Klik produk untuk melihat detail komposisi & stok, atau langsung tambahkan ke keranjang belanja.</p>
</div>
<div class="wrap">
  <div class="bar">
    <div>
      <button class="cat on" onclick="pilihKat('Semua',this)">Semua</button>
      <button class="cat" onclick="pilihKat('Makanan',this)">Makanan</button>
      <button class="cat" onclick="pilihKat('Minuman',this)">Minuman</button>
      <button class="cat" onclick="pilihKat('Bumbu',this)">Bumbu</button>
    </div>
    <input id="cari" placeholder="Cari produk..." onkeyup="tampil()" style="width:230px;margin:0">
  </div>
  <div class="grid" id="produk"></div>
  <div class="rev">
    <h3>⭐ Ulasan & Testimoni Pelanggan</h3>
    <input id="rn" placeholder="Nama Anda">
    <select id="rb"><option value="⭐⭐⭐⭐⭐">⭐⭐⭐⭐⭐ (5/5)</option><option value="⭐⭐⭐⭐">⭐⭐⭐⭐ (4/5)</option><option value="⭐⭐⭐">⭐⭐⭐ (3/5)</option></select>
    <textarea id="ri" rows="2" placeholder="Tulis ulasan Anda..."></textarea>
    <button class="btn" onclick="kirimRev()">Kirim Ulasan</button>
    <div id="rev-list"></div>
  </div>
</div>
<div class="modal mid" id="det-m"><div class="pop"><button onclick="tutup('det-m')" style="float:right;border:none;background:none;font-size:22px;cursor:pointer">&times;</button><div id="det-isi"></div></div></div>
<div class="modal" id="cart-m">
  <div class="panel">
    <div style="display:flex;justify-content:space-between;align-items:center"><h3>Keranjang Belanja</h3><button onclick="tutup('cart-m')" style="border:none;background:none;font-size:22px;cursor:pointer">&times;</button></div>
    <div id="cart-isi" style="flex:1;margin:10px 0"></div>
    <select id="ongkir" onchange="updateCart()"><option value="10000">Balikpapan Kota (Rp 10.000)</option><option value="20000">Luar Kota / Samarinda (Rp 20.000)</option><option value="0">Ambil di Toko (Gratis)</option></select>
    <select id="bayar"><option value="QRIS">QRIS (Dana/GoPay/m-Banking)</option><option value="Transfer Bank">Transfer Bank (BCA/Mandiri)</option><option value="COD">COD (Bayar di Tempat)</option></select>
    <input id="pn" placeholder="Nama Pemesan">
    <textarea id="pa" rows="2" placeholder="Alamat Pengiriman"></textarea>
    <div style="background:#fef3c7;padding:10px;border-radius:6px;margin-bottom:8px">Total: <b id="tot">Rp 0</b></div>
    <button class="btn" style="background:#16a34a;width:100%" onclick="wa()">Checkout via WhatsApp</button>
  </div>
</div>
<footer>&copy; 2026 BorneoRasa UMKM Balikpapan - Tugas UAS Sistem Informasi</footer>
<script>
const db=[
  {id:1,n:"Amplang Kuku Macan",k:"Makanan",h:25000,s:18,b:"200gr",bh:"Ikan tenggiri segar, tapioka, telur, bawang putih.",i:"🐟",d:"Kerupuk ikan tenggiri renyah khas Balikpapan."},
  {id:2,n:"Keripik Singkong Balado",k:"Makanan",h:15000,s:25,b:"250gr",bh:"Singkong pilihan, cabai merah, gula aren.",i:"🥔",d:"Keripik singkong pedas manis tanpa pengawet."},
  {id:3,n:"Kopi Liberika Borneo",k:"Minuman",h:45000,s:12,b:"250gr",bh:"100% biji kopi Liberika sangrai Kalimantan Timur.",i:"☕",d:"Kopi khas Kalimantan dengan aroma nangka unik."},
  {id:4,n:"Sirup Mangrove Segar",k:"Minuman",h:30000,s:15,b:"500ml",bh:"Sari buah mangrove pedada, gula pasir murni.",i:"🍹",d:"Minuman sehat kaya antioksidan alami."},
  {id:5,n:"Sambal Raja Kutai",k:"Bumbu",h:28000,s:10,b:"200gr",bh:"Cabai rawit, terong ungu, kacang panjang, terasi.",i:"🌶️",d:"Sambal khas Kutai dengan potongan sayur segar."},
  {id:6,n:"Abon Kepiting Balikpapan",k:"Bumbu",h:55000,s:8,b:"150gr",bh:"Daging kepiting bakau murni, santan, rempah.",i:"🦀",d:"Abon daging kepiting murni 100% tanpa campuran."}
];
const WA="6281234567890";
let cart=[],kat="Semua";
const rp=x=>"Rp "+x.toLocaleString("id-ID");
const buka=id=>document.getElementById(id).classList.add("open");
const tutup=id=>document.getElementById(id).classList.remove("open");

function pilihKat(k,el){kat=k;document.querySelectorAll(".cat").forEach(b=>b.classList.remove("on"));el.classList.add("on");tampil();}
function tampil(){
  const q=document.getElementById("cari").value.toLowerCase();
  const f=db.filter(p=>(kat==="Semua"||p.k===kat)&&p.n.toLowerCase().includes(q));
  document.getElementById("produk").innerHTML=f.map(p=>`
    <div class="card">
      <div class="ico" onclick="detail(${p.id})">${p.i}</div>
      <small style="color:#d97706;font-weight:bold">${p.k}</small>
      <h3 style="margin:4px 0;cursor:pointer" onclick="detail(${p.id})">${p.n}</h3>
      <small style="color:#16a34a;font-weight:bold">Stok: ${p.s} pcs</small>
      <p style="font-size:13px;color:#6b7280;flex:1">${p.d}</p>
      <div style="display:flex;justify-content:space-between;align-items:center;border-top:1px solid #eee;padding-top:8px">
        <b>${rp(p.h)}</b>
        <div><button onclick="detail(${p.id})" style="padding:5px 8px;border:1px solid #ccc;border-radius:5px;cursor:pointer">Detail</button> <button class="btn" style="padding:6px 10px" onclick="add(${p.id})">+ Keranjang</button></div>
      </div>
    </div>`).join("")||"<p>Produk tidak ditemukan.</p>";
}
function detail(id){
  const p=db.find(x=>x.id===id);
  document.getElementById("det-isi").innerHTML=`<div style="font-size:55px;text-align:center;background:#fef3c7;padding:15px;border-radius:8px">${p.i}</div><h3>${p.n} (${p.b})</h3><p style="color:#d97706;font-weight:bold">${rp(p.h)} | Stok: ${p.s}</p><p><b>Komposisi:</b> ${p.bh}</p><p>${p.d}</p><button class="btn" style="width:100%" onclick="add(${p.id});tutup('det-m')">+ Keranjang</button>`;
  buka("det-m");
}
function add(id){
  const p=db.find(x=>x.id===id),a=cart.find(c=>c.id===id);
  if((a?a.qty:0)>=p.s)return alert("Melebihi stok!");
  a?a.qty++:cart.push({...p,qty:1});updateCart();
}
function qty(id,d){
  const i=cart.findIndex(c=>c.id===id),p=db.find(x=>x.id===id);
  if(d>0&&cart[i].qty>=p.s)return alert("Stok maksimal!");
  cart[i].qty+=d;if(cart[i].qty<=0)cart.splice(i,1);updateCart();
}
function updateCart(){
  const sub=cart.reduce((s,c)=>s+c.h*c.qty,0),ong=cart.length?+document.getElementById("ongkir").value:0;
  document.getElementById("cnt").innerText=cart.reduce((s,c)=>s+c.qty,0);
  document.getElementById("tot").innerText=rp(sub+ong);
  document.getElementById("cart-isi").innerHTML=cart.length?cart.map(c=>`<div style="display:flex;justify-content:space-between;padding:8px 0;border-bottom:1px solid #eee"><div><b>${c.n}</b><br><small>${rp(c.h)} x ${c.qty}</small></div><div><button onclick="qty(${c.id},-1)">-</button> ${c.qty} <button onclick="qty(${c.id},1)">+</button></div></div>`).join(""):"<p>Keranjang kosong.</p>";
}
function wa(){
  const n=document.getElementById("pn").value,a=document.getElementById("pa").value;
  if(!cart.length||!n||!a)return alert("Lengkapi keranjang, nama, dan alamat!");
  const ong=document.getElementById("ongkir"),byr=document.getElementById("bayar").value;
  const txt=`Halo BorneoRasa, pesanan saya:\n`+cart.map((c,i)=>`${i+1}. ${c.n} (${c.qty}x) = ${rp(c.h*c.qty)}`).join("\n")+`\nOngkir: ${ong.options[ong.selectedIndex].text}\nTotal: ${document.getElementById("tot").innerText}\nBayar: ${byr}\nNama: ${n}\nAlamat: ${a}`;
  window.open(`https://wa.me{WA}?text=${encodeURIComponent(txt)}`,"_blank");
}
const defRev=[{n:"Aulia Rahma",b:"⭐⭐⭐⭐⭐",i:"Amplangnya renyah banget, pengiriman Balikpapan cepat!"},{n:"Dimas Pratama",b:"⭐⭐⭐⭐⭐",i:"Kopi Liberika wangi khas, bayar pakai QRIS praktis."}];
function loadRev(){
  const l=JSON.parse(localStorage.getItem("rev_br"))||defRev;
  document.getElementById("rev-list").innerHTML=l.map(r=>`<div class="rev-item"><b>${r.n}</b> ${r.b}<p style="margin:4px 0 0;font-size:13px">${r.i}</p></div>`).join("");
}
function kirimRev(){
  const n=document.getElementById("rn").value.trim(),b=document.getElementById("rb").value,i=document.getElementById("ri").value.trim();
  if(!n||!i)return alert("Isi nama dan ulasan!");
  const l=JSON.parse(localStorage.getItem("rev_br"))||defRev;l.unshift({n,b,i});
  localStorage.setItem("rev_br",JSON.stringify(l));document.getElementById("rn").value="";document.getElementById("ri").value="";loadRev();
}
tampil();updateCart();loadRev();
</script>
</body>
</html>
